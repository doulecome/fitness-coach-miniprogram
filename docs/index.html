<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>健身教练 · 网页版预览</title>
<style>
/* ===== 桌面舞台 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: linear-gradient(135deg, #1a2029 0%, #0f1419 100%); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
</style>
<style>
/* ===== 壳 ===== */
:root { --g:#1FD6A8; --gd:#0fb98c; --ink:#1a2129; --sub:#7a838e; --bg:#f5f6f8; --card:#fff; --line:#eceef2; --red:#ff5c5c; }
.phone { position: relative; width: 400px; max-width: 100vw; height: min(880px, 100vh); background: var(--bg); overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.55); display: flex; flex-direction: column; }
@media (max-width: 420px) { body { display:block; } .phone { height:100vh; width:100vw; } }
#app { display:flex; flex-direction:column; height:100%; position:relative; }
#topbar { flex:none; background:var(--card); padding:14px 18px 12px; font-weight:800; font-size:19px; color:var(--ink); display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
#topbar .tb-sub { font-size:11px; font-weight:500; color:var(--sub); margin-left:auto; }
#view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 8px; }
#tabbar { flex:none; background:var(--card); border-top:1px solid var(--line); display:flex; height:54px; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9aa0a8; font-size:10px; cursor:pointer; }
.tab .t-ic { font-size:20px; line-height:1; }
.tab.on { color:var(--gd); font-weight:700; position:relative; }
.tab.on::after { content:''; position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:20px; height:3px; border-radius:3px; background:var(--gd); }
#sheetMask, #wkoMask { position:absolute; inset:0; z-index:30; }
#sheetMask { background:rgba(15,20,25,.45); display:flex; align-items:flex-end; }
#wkoMask { background:#0b0f13; display:none; }

/* ===== 通用组件 ===== */
.card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(20,30,40,.04); }
.h-sec { font-size:15px; font-weight:800; color:var(--ink); margin:6px 2px 10px; display:flex; align-items:center; gap:6px; }
.h-sec .more { margin-left:auto; font-size:11px; color:var(--sub); font-weight:500; }
.btn { background:linear-gradient(135deg,#1FD6A8,#0fb98c); color:#fff; border:none; border-radius:999px; font-weight:800; cursor:pointer; }
.btn.ghost { background:#eef0f2; color:var(--ink); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:7px 14px; border-radius:999px; background:#eef0f2; font-size:12px; color:#4a525c; cursor:pointer; border:1px solid transparent; }
.chip.on { background:rgba(31,214,168,.14); color:var(--gd); border-color:var(--gd); font-weight:700; }
.empty { text-align:center; color:var(--sub); font-size:13px; padding:36px 10px; }
.empty .e-ic { font-size:38px; margin-bottom:10px; }

/* ===== 首页 ===== */
.hero { position:relative; border-radius:20px; overflow:hidden; color:#fff; margin-bottom:14px; background:linear-gradient(135deg,#0d8f6f,#07c08b); box-shadow:0 10px 26px rgba(13,143,111,.20); }
.hero .hero-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:heroKen 22s ease-in-out infinite alternate; transform-origin:center; }
.hero .hero-veil { position:absolute; inset:0; background:linear-gradient(200deg,rgba(6,16,12,.06) 22%,rgba(6,16,12,.84) 80%); }
.hero .hero-in { position:relative; display:flex; flex-direction:column; min-height:184px; padding:16px 16px 15px; }
.hero .h-top { display:flex; align-items:center; gap:6px; position:relative; }
.hero .h-day { font-size:11px; font-weight:700; letter-spacing:.3px; text-shadow:0 1px 5px rgba(0,0,0,.35); }
.hero .h-week { margin-left:auto; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.22); backdrop-filter:blur(4px); text-shadow:none; }
.hero .h-t { font-size:23px; font-weight:900; margin-top:auto; padding-top:20px; letter-spacing:-.2px; line-height:1.2; text-shadow:0 1px 8px rgba(0,0,0,.28); }
.hero .h-desc { font-size:11.5px; opacity:.95; margin-top:5px; line-height:1.45; text-shadow:0 1px 5px rgba(0,0,0,.35); }
.hero .h-cta { margin-top:13px; align-self:flex-start; display:inline-flex; align-items:center; gap:5px; background:#fff; color:#0d8f6f; padding:9px 20px; border-radius:999px; font-weight:900; font-size:13px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.18); }
.hero .h-em { position:absolute; right:14px; top:52px; font-size:52px; opacity:.92; filter:drop-shadow(0 4px 10px rgba(0,0,0,.28)); }
.stats-row { display:flex; gap:8px; margin-bottom:14px; }
.stat { flex:1; background:var(--card); border-radius:14px; padding:12px 4px 11px; text-align:center; border:1px solid var(--line); }
.stat .n { font-size:23px; font-weight:900; color:var(--ink); letter-spacing:-.3px; }
.stat .l { font-size:10px; color:var(--sub); margin-top:3px; letter-spacing:.2px; }
.course-strip { display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.cs-card { flex:none; width:176px; height:118px; border-radius:16px; overflow:hidden; position:relative; cursor:pointer; scroll-snap-align:start; background:linear-gradient(135deg,#1FD6A8,#0d8f6f); box-shadow:0 6px 16px rgba(15,25,35,.12); }
.cs-card img { width:100%; height:100%; object-fit:cover; display:block; }
.cs-card .cs-veil { position:absolute; inset:0; background:linear-gradient(180deg,rgba(6,12,10,0) 34%,rgba(6,12,10,.78) 100%); }
.cs-card .cs-tag { position:absolute; left:8px; top:8px; z-index:2; font-size:9px; font-weight:800; padding:3px 8px; border-radius:999px; color:#fff; background:rgba(10,16,14,.46); backdrop-filter:blur(3px); letter-spacing:.3px; }
.cs-card .cs-txt { position:absolute; left:11px; right:11px; bottom:9px; z-index:2; }
.cs-card .c-n { font-size:13.5px; font-weight:900; color:#fff; line-height:1.25; text-shadow:0 1px 6px rgba(0,0,0,.45); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cs-card .c-m { font-size:10px; color:rgba(255,255,255,.86); margin-top:3px; }
.cs-card .img-fb { height:118px; font-size:34px; }
.last-rec { display:flex; align-items:center; gap:12px; }
.last-rec .lr-ic { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; }
.last-rec .lr-n { font-weight:800; font-size:14px; color:var(--ink); }
.last-rec .lr-s { font-size:11px; color:var(--sub); margin-top:3px; }
.last-rec .btn { margin-left:auto; padding:8px 18px; font-size:12px; }

/* ===== 训练库 ===== */
.seg { display:flex; background:#e9ebee; border-radius:12px; padding:3px; margin-bottom:12px; }
.seg .sg { flex:1; text-align:center; padding:8px 0; font-size:13px; font-weight:700; color:#6a727c; border-radius:10px; cursor:pointer; }
.seg .sg.on { background:#fff; color:var(--gd); box-shadow:0 1px 4px rgba(0,0,0,.08); }
.course-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.course-card { background:var(--card); border-radius:16px; padding:14px; cursor:pointer; }
.course-card .cc-ic { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; }
.course-card .cc-n { font-weight:800; font-size:14px; margin-top:10px; color:var(--ink); }
.course-card .cc-m { font-size:11px; color:var(--sub); margin-top:4px; }
.course-card .cc-btn { margin-top:10px; text-align:center; padding:8px 0; font-size:12px; }
.act-row { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
.act-row .a-ic { width:38px; height:38px; border-radius:10px; background:#f0f2f4; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
.act-row .a-n { font-weight:700; font-size:13px; color:var(--ink); }
.act-row .a-s { font-size:11px; color:var(--sub); margin-top:2px; }
.act-row .a-g { margin-left:auto; width:46px; height:46px; border-radius:10px; overflow:hidden; flex:none; background:#f5f6f8; box-shadow: inset 0 0 0 1px rgba(17,24,32,.06); }
.act-row .a-g img, .act-row .a-g video { width:100%; height:100%; object-fit:cover; display:block; }
.img-fb { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
.a-g .img-fb, .wk-next .img-fb { font-size:24px; }
.demo .img-fb { height:200px; font-size:64px; background:#f5f6f8; }
.wk-gif .img-fb { font-size:64px; }
.act-row .a-go { font-size:20px; color:#c3c8cf; margin-left:4px; }

/* ===== 自定义训练 builder ===== */
.bld-hint { font-size:12px; color:var(--sub); margin:4px 2px 12px; line-height:1.6; }
.bld-g { font-size:12px; font-weight:800; color:var(--ink); margin:14px 2px 8px; opacity:.7; }
.bld-it { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; border:2px solid transparent; }
.bld-it.on { border-color:var(--gd); background:#eafaf4; }
.bld-it .b-ic { width:38px; height:38px; border-radius:10px; background:#f0f2f4; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
.bld-it .b-n { font-weight:700; font-size:13px; color:var(--ink); }
.bld-it .b-go { margin-left:auto; width:26px; height:26px; border-radius:50%; background:#e9ebee; color:#8a9099; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
.bld-it.on .b-go { background:var(--gd); color:#fff; }
.bld-foot { position:sticky; bottom:0; display:flex; align-items:center; gap:10px; padding:12px 10px; margin-top:6px; background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%); }
.bld-ct { font-size:13px; color:var(--sub); }
.bld-ct b { color:var(--gd); font-size:16px; }
.bld-rd { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); }
.bld-rd b { color:var(--ink); }
.bld-rd .r-btn { width:26px; height:26px; border-radius:50%; background:#eef0f2; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
.bld-go { margin-left:auto; padding:11px 18px; font-size:14px; white-space:nowrap; }

/* ===== 计划 ===== */
.form-t { font-size:13px; font-weight:800; color:var(--ink); margin:16px 2px 8px; }
.form-t:first-child { margin-top:2px; }
.gen-btn { margin-top:18px; padding:15px; font-size:16px; }
.phase-tabs { display:flex; gap:6px; margin-bottom:10px; }
.pt { flex:1; background:var(--card); border-radius:12px; padding:8px 4px; text-align:center; cursor:pointer; border:1px solid transparent; }
.pt .pt-i { font-size:11px; color:var(--sub); }
.pt .pt-l { font-size:12px; font-weight:800; margin-top:2px; color:var(--ink); }
.pt.on { border-color:var(--gd); background:rgba(31,214,168,.08); }
.pt.on .pt-i, .pt.on .pt-l { color:var(--gd); }
.phase-tip { font-size:12px; color:#4a525c; background:#eef7f4; border-radius:10px; padding:9px 12px; margin-bottom:10px; line-height:1.5; }
.sum-chips { display:flex; gap:8px; margin-bottom:12px; }
.sum-chips .sc { flex:1; background:var(--card); border-radius:12px; text-align:center; padding:10px 2px; }
.sum-chips .sc .n { font-size:20px; font-weight:900; color:var(--ink); }
.sum-chips .sc .l { font-size:10px; color:var(--sub); }
.day-card { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
.day-card.rest { background:transparent; border:1px dashed #d5d9de; display:flex; align-items:center; gap:10px; cursor:default; }
.dc-h { display:flex; align-items:center; gap:8px; }
.dc-wd { font-size:13px; font-weight:900; color:var(--gd); min-width:30px; }
.dc-t { font-weight:800; font-size:14px; color:var(--ink); }
.dc-m { font-size:11px; color:var(--sub); margin:5px 0 8px 38px; }
.dc-act { font-size:12px; color:#4a525c; background:#f5f7f8; border-radius:8px; padding:6px 9px; margin:4px 0 4px 38px; }
.dc-act b { color:var(--gd); }
.dc-foot { display:flex; align-items:center; gap:6px; margin:8px 0 0 38px; }
.dc-tag { font-size:10px; color:var(--sub); }
.dc-run { margin-left:auto; padding:7px 18px; font-size:12px; }
.rest-em { font-size:22px; }
.dc-rest { font-size:13px; color:var(--sub); }

/* ===== bottom sheet ===== */
.sheet { width:100%; background:#fff; border-radius:20px 20px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); max-height:78%; overflow-y:auto; }
.sh-h { display:flex; align-items:center; }
.sh-h .x { margin-left:auto; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#f0f2f4; cursor:pointer; color:#6a727c; }
.sh-t { font-size:17px; font-weight:900; color:var(--ink); }
.sh-sub { font-size:12px; color:var(--sub); margin-top:4px; }
.demo { width:100%; border-radius:14px; background:#f5f6f8; margin:14px 0; overflow:hidden; position:relative; box-shadow: inset 0 0 0 1px rgba(17,24,32,.05); }
.demo img, .demo video { width:100%; aspect-ratio:1/1; height:auto; object-fit:cover; object-position:center; display:block; }
.cue-box { background:#eef7f4; border:1px solid rgba(31,214,168,.35); border-radius:12px; padding:10px 12px; font-size:12px; color:#135a48; line-height:1.6; }
.zh-steps { margin-top:10px; background:#f7f9fb; border-radius:12px; padding:10px 12px; }
.zh-st-h { font-size:12px; font-weight:800; color:#4a525c; margin-bottom:6px; }
.zh-st { display:flex; gap:8px; font-size:12px; color:#3a424c; line-height:1.55; padding:4px 0; border-bottom:1px dashed #eef1f4; }
.zh-st:last-child { border-bottom:none; }
.zh-st > span { flex:none; width:18px; height:18px; border-radius:50%; background:var(--g); color:#043; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.rec-warn { background:#fff1ef; color:#c0392b; border-radius:8px; padding:5px 8px; font-size:11px; margin:6px 0; display:block; }
.rec-warn .rec-fix { color:#b3431f; font-weight:800; text-decoration:underline; cursor:pointer; margin-left:4px; }
.day-card.warn { box-shadow:0 0 0 1.5px rgba(192,57,43,.35); }
.backup-card .bk-btns { display:flex; gap:10px; }
.backup-card .bk-btns .btn { flex:1; text-align:center; }
.train-loop .vol-row { display:flex; gap:8px; margin-top:4px; }
.train-loop .vol-b { flex:1; background:#f5f7f8; border-radius:10px; padding:8px 6px; text-align:center; }
.train-loop .vol-b .n { font-size:17px; font-weight:800; color:var(--gd); }
.train-loop .vol-b .l { font-size:10px; color:#a0a6ad; }
.eq-chips { margin-bottom:4px; }
.row-line { display:flex; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid #f2f4f6; font-size:13px; color:var(--ink); }
.row-line:last-child { border-bottom:none; }
.row-line .t { font-size:10px; padding:2px 8px; border-radius:999px; background:#f0f2f4; color:#6a727c; flex:none; }
.row-line .t.main { background:rgba(31,214,168,.15); color:var(--gd); font-weight:700; }
.row-line .t.fin { background:#fff2d9; color:#b07d1a; }
.row-line .t.cool { background:#e8f0ff; color:#3b6fd6; }
.row-line .r { margin-left:auto; font-weight:800; color:var(--gd); font-size:13px; }
.row-line .last { font-size:11px; color:var(--sub); }
.warm-box { font-size:12px; color:#8a6a10; background:#fff8e8; border-radius:10px; padding:8px 12px; line-height:1.6; margin:8px 0; }
.coach-box { font-size:12px; color:#4a525c; background:#f5f7f8; border-radius:10px; padding:8px 12px; line-height:1.6; margin:8px 0; }
.sh-go { margin-top:12px; padding:13px; font-size:15px; text-align:center; }

/* ===== 记录 ===== */
.pb-row { display:flex; align-items:flex-end; gap:3px; height:44px; margin-top:10px; }
.pb-col { flex:1; background:#e3e7eb; border-radius:3px 3px 0 0; min-height:3px; position:relative; }
.pb-col.best { background:var(--gd); }
.pb-row.vs { align-items:center; }
.rec-list .rl { display:flex; align-items:center; gap:10px; padding:10px 12px; }
.rec-list .rl .rn { font-weight:700; font-size:13px; color:var(--ink); }
.rec-list .rl .rd { font-size:11px; color:var(--sub); margin-top:2px; }
.rec-list .rl .rm { margin-left:auto; text-align:right; }
.rec-list .rl .rm .n { font-size:12px; color:var(--gd); font-weight:800; }
.rec-list .rl .rm .l { font-size:10px; color:var(--sub); }
.ok { color:var(--gd); } .no { color:#c3c8cf; }

/* ===== 饮食规划 / 趋势图 / 表单输入 ===== */
.flds { display:flex; gap:8px; }
.fld { flex:1; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 12px; font-size:15px; color:var(--ink); font-weight:700; outline:none; font-family:inherit; }
.fld:focus { border-color:var(--gd); }
.diet-sum { background:linear-gradient(135deg,#0d8f6f,#07c08b); color:#fff; box-shadow:0 10px 26px rgba(13,143,111,.2); }
.diet-sum .ds-row { display:flex; gap:10px; }
.diet-sum .ds-b { flex:1; text-align:center; }
.diet-sum .n { font-size:25px; font-weight:900; letter-spacing:-.5px; }
.diet-sum .l { font-size:10px; opacity:.85; margin-top:2px; }
.diet-sum .ds-target { text-align:center; margin-top:13px; font-size:13px; opacity:.96; }
.diet-sum .ds-k { font-size:21px; font-weight:900; }
.macro-bar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:#eee; margin:4px 0 10px; }
.macro-bar .mp { display:block; }
.macro-bar .mp.p { background:var(--gd); }
.macro-bar .mp.c { background:#f0a23a; }
.macro-bar .mp.f { background:#6a78d6; }
.macro-leg { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); }
.macro-leg b { font-size:14px; }
.meal-card { background:var(--card); border-radius:14px; padding:11px 13px; margin-bottom:9px; box-shadow:0 2px 8px rgba(20,30,40,.04); }
.meal-card .mc-h { display:flex; align-items:center; gap:8px; }
.meal-card .mc-t { font-weight:800; font-size:14px; color:var(--ink); }
.meal-card .mc-pct { font-size:10px; color:#fff; background:var(--gd); padding:1px 7px; border-radius:999px; }
.meal-card .mc-k { margin-left:auto; font-size:12px; color:var(--sub); font-weight:700; }
.meal-card .mc-p { font-size:12px; color:#4a525c; padding:4px 0 0; }
.meal-card .mc-a { color:var(--sub); font-size:11px; margin-left:4px; }
.mc-bd { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.mc-bd .bd { font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:700; }
.mc-bd .bd.g { background:rgba(31,214,168,.12); color:#0c9c79; }
.mc-bd .bd.w { background:#fff1e8; color:#c4691f; }
.diet-pair .gc { background:#f5f7f8; border-radius:10px; padding:9px 11px; margin-bottom:7px; }
.diet-pair .gc-c { font-size:13px; font-weight:800; color:var(--ink); }
.diet-pair .gc-t { font-size:11px; color:#7a838e; margin-top:2px; line-height:1.5; }
.pc { margin-bottom:10px; }
.pc-l { font-size:12px; font-weight:800; color:var(--sub); margin:0 0 6px; }
.chip.sm { font-size:12px; padding:6px 11px; }
.pair-res { margin-top:12px; border-radius:12px; padding:11px 12px; }
.pair-res.g { background:rgba(31,214,168,.1); border:1px solid rgba(31,214,168,.3); }
.pair-res.w { background:#fff4ec; border:1px solid #ffd9bf; }
.pr-h { font-size:13px; font-weight:900; margin-bottom:7px; color:var(--ink); }
.pr { font-size:11.5px; color:#4a525c; line-height:1.55; padding:5px 0; border-bottom:1px solid rgba(0,0,0,.04); }
.pr:last-child { border-bottom:none; }
.pr.g b { color:#0c9c79; }
.pr.w b { color:#c4691f; }
.pr-fix { color:#3b6fd6; font-weight:700; }

/* ===== 记录趋势图 ===== */

.trend .tb-l { font-size:9px; color:var(--sub); margin-top:5px; }
.trend .tb-v { font-size:10px; font-weight:800; color:var(--gd); }

/* ===== 跟练 ===== */
#wko { position:absolute; inset:0; background:#0b0f13; color:#fff; display:flex; flex-direction:column; z-index:40; }
.wk-top { padding:14px 16px 0; display:flex; align-items:center; }

.wk-ready .r-l { font-size:16px; color:rgba(255,255,255,.8); margin-top:8px; }

.wk-act-name { font-size:27px; font-weight:900; text-align:center; letter-spacing:-.2px; line-height:1.25; }

.wk-side { display:flex; flex-direction:column; gap:10px; }
.wk-mini { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; color:#fff; }

.wk-next .wn-t { font-size:11px; opacity:.6; }
.wk-next .wn-n { font-size:13px; font-weight:700; margin-top:2px; }
.wk-done { text-align:center; padding:0 10px; }
.wk-done .d-ic { font-size:72px; }
.wk-done .d-t { font-size:28px; font-weight:900; margin-top:10px; }
.wk-done .d-p { color:rgba(255,255,255,.8); font-size:13px; margin-top:6px; line-height:1.6; }
.wk-done .d-rec { margin-top:16px; color:#ffd45c; font-size:15px; font-weight:800; }
.wk-warm { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:16px; max-width:300px; }

.diff-seg .o { flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:700; color:#6a727c; background:#eef0f2; border-radius:10px; cursor:pointer; transition:background .15s,color .15s; }

/* ===== 动效与交互细化（再优化显示） ===== */
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@keyframes maskIn { from { opacity:0; } to { opacity:1; } }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes sheetDown { from { transform:translateY(0); } to { transform:translateY(100%); } }
@keyframes shimmer { 0% { background-position:-180% 0; } 100% { background-position:180% 0; } }
@keyframes popIn { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:none; } }
@keyframes heroKen { from { transform:scale(1); } to { transform:scale(1.14); } }

/* hero 内文错峰浮现：沉浸大卡逐行入场 */
.hero .h-top, .hero .h-t, .hero .h-desc, .hero .h-cta, .hero .h-em { animation:fadeUp .5s ease both; }
.hero .h-t { animation-delay:.06s; }
.hero .h-desc { animation-delay:.12s; }
.hero .h-cta { animation-delay:.18s; }

/* 课程横滑卡：逐张弹入，营造 Keep 式推荐流动感 */
.course-strip { animation:none; }
.course-strip .cs-card { animation:popIn .42s cubic-bezier(.22,1,.36,1) both; }
.course-strip .cs-card:nth-child(1) { animation-delay:.03s; }
.course-strip .cs-card:nth-child(2) { animation-delay:.08s; }

/* tab 指示点：切换时轻轻弹出 */
.tab.on::after { animation:popIn .25s ease both; }

/* 切 tab / 切视图：区块错峰淡入上浮 */
#view > * { animation:fadeUp .32s ease both; }

#view > *:nth-child(3) { animation-delay:.08s; }
#view > *:nth-child(4) { animation-delay:.12s; }
#view > *:nth-child(5) { animation-delay:.16s; }

/* 底部弹层：遮罩淡入 + 面板从底部滑入 */
#sheetMask.in { animation:maskIn .25s ease; }
#sheetMask .sheet { animation:sheetUp .34s cubic-bezier(.22,1,.36,1); }
#sheetMask.closing .sheet { animation:sheetDown .26s ease forwards; }

/* 按压反馈 */
.cs-card, .course-card, .day-card, .act-row, .tab, .pt, .chip { transition:transform .12s ease; }
.cs-card:active, .course-card:active, .day-card:active:not(.rest), .act-row:active, .pt:active, .chip:active { transform:scale(.97); }
.tab:active { transform:scale(.92); }
.btn { transition:transform .12s ease, filter .12s ease; }
.btn:active { transform:scale(.96); filter:brightness(.95); }

/* 图片加载占位微光（CDN 加载途中不空不黑） */
.cs-card img, .a-g img, .a-g video, .wk-gif img, .wk-gif video, .demo img, .demo video, .hero-bg, .hero-bg video { background:linear-gradient(100deg, rgba(255,255,255,.05) 20%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.05) 80%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }

/* 跟练页阶段切换柔化 */
#wko > * { animation:fadeUp .3s ease both; }

.var-chips .vk.adv { background:rgba(31,214,168,.16); color:#0c9c79; }

olKey, rot) {\n  const arr = poolActs(poolKey);\n  return arr.length ? arr[rot % arr.length] : null;\n}\n\n// —— 训练量参数：由「单次时长 × 水平」预算执行位数量，再反推主项组数 ——\n// 位 = 一个动作的一次执行（含组间休息）。基础位预算按水平打折：新手 75% / 进阶 100% / 老手 115%\nconst BIT_BUDGET = { 15: 9, 30: 16, 45: 22 };\nconst BIT_LEVEL_K = { 新手: 0.75, 进阶: 1, 老手: 1.15 };\n\nfunction layout(length, level, type, phaseKey) {\n  let nMain;\n  if (length <= 15) nMain = 2;\n  else if (length <= 30) nMain = level === '新手' ? 2 : 3;\n  else nMain = level === '新手' ? 3 : 4;\n  // 主项之外的固定位：力量日有核心收尾 + 冷身；燃脂/核心只有冷身\n  const extra = (type === 'push' || type === 'legs') ? 2 : 1;\n  const bits = Math.max(5, Math.round((BIT_BUDGET[length] || 16) * (BIT_LEVEL_K[level] || 1)));\n  let r = Math.max(1, Math.floor((bits - extra) / nMain));\n  if (phaseKey === 'peak') r += 1; // W3 强化期主项各加 1 组\n  r = Math.min(6, Math.max(1, r));\n  return { nMain, rMain: r };\n}\n\n// —— 动作级个性化目标（v3 规则保留）——\n// reps 无历史 -> base × LEVEL_K；有历史 -> W1 max(base,best) / W2 best+2 / W3 best+4 / W4 ≈best×70%\n// time         -> base × LEVEL_K，W2/W3 +5%/+10%，W4 ×70%\nfunction computeGoal(act, phaseKey, level, hist) {\n  const k = LEVEL_K[level] || 1;\n  const base = act.value;\n  if (act.type === 'time') {\n    let raw;\n    if (phaseKey === 'deload') raw = base * 0.7;\n    else if (phaseKey === 'prog') raw = base * Math.min(1.2, k + 0.05);\n    else if (phaseKey === 'peak') raw = base * Math.min(1.3, k + 0.1);\n    else raw = base * k;\n    const target = Math.max(15, Math.round(raw / 5) * 5);\n    return { target, unit: '秒' };\n  }\n  const rec = hist ? hist[act.name] : null;\n  const best = rec && rec.best ? rec.best : 0;\n  if (!best) {\n    const t = phaseKey === 'deload' ? Math.max(3, Math.round(base * k * 0.7)) : Math.max(1, Math.round(base * k));\n    return { target: t, unit: '次' };\n  }\n  // 渐进超负荷：按「比例」递增，基数越大每次加得越多；小基数靠保底增量兜底，避免固定 +2/+4 失真\n  const start = Math.max(base, best); // W1 起点 = 课程量或历史最佳的地板\n  // 自适应回退：最近 3 次均值显著低于起点（<80%），说明没打满 → 目标回退到近期均值 +5%，避免越定越挫败\n   /* ============ 语音教练 / 连续打卡 / 实时 HUD ============ */
  var VOICE_ON = loadK('fit_voice', true);
  function phaseLabel(p) { return p === 'fin' ? '收尾' : p === 'cool' ? '冷身' : p === 'warm' ? '热身' : '正式'; }
  // 队列式播报：说完一条再播下一条，避免连续播报被 cancel 掐断；语速降到 0.9 更清晰
  var SP_Q = [], SP_BUSY = false;
  function spNext() {
    if (SP_BUSY) return;
    if (!SP_Q.length) { SP_BUSY = false; return; }
    var txt = SP_Q.shift();
    try {
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1; u.volume = 1;
      var vs = window.speechSynthesis.getVoices();
      for (var i = 0; i < vs.length; i++) { if (vs[i].lang && vs[i].lang.toLowerCase().indexOf('zh') >= 0) { u.voice = vs[i]; break; } }
      u.onend = spNext; u.onerror = spNext;
      SP_BUSY = true;
      window.speechSynthesis.speak(u);
    } catch (e) { SP_BUSY = false; spNext(); }
  }
  function speak(text) {
    if (!VOICE_ON || !('speechSynthesis' in window) || !text) return;
    SP_Q.push(text);
    if (!SP_BUSY) spNext();
  }
  function spStop() { SP_Q = []; SP_BUSY = false; if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
  function streak() {
    var days = {}; S.records.forEach(function (r) { days[r.date] = 1; });
    var s = 0, d = new Date();
    for (;;) {
      var m = '0' + (d.getMonth() + 1), dd = '0' + d.getDate();
      var key = d.getFullYear() + '-' + m.slice(-2) + '-' + dd.slice(-2);
      if (days[key]) { s++; d.setDate(d.getDate() - 1); } else break;
    }
    return s;
  }
  function updateHUD() {
    if (!W) return;

    var mm = Math.floor(sec / 60), ss = sec % 60;
    var txt = '⏱ ' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    if (W.kcal) txt += ' · ≈' + Math.round(W.kcal * (sec / 60) / 20) + ' 千卡';
    h.textContent = txt;
  }

  /* ===== 组间节拍器：休息倒计时轻 tick，结束强 beep + 震动 ===== */
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} } return; }
    try { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } catch (e) {}
  }
  function beep(freq, dur, vol) {
    if (!AC) return;
    try {
      if (AC.state === 'suspended') AC.resume();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(AC.destination);
      var t = AC.currentTime;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function tick() { beep(760, 0.07, 0.08); }            // 倒计时每秒轻提示
  function restEnd() {                                  // 休息结束 → 进下一动作
    beep(1320, 0.22, 0.22);
    if (navigator.vibrate) { try { navigator.vibrate([0, 110, 70, 110]); } catch (e) {} }
  }

  /* ============ 难度模式 ============ */
  function diffCfg(d) {
    if (d === 'easy') return { mul: 0.7, restAdd: 5, kcal: 0.8, label: '轻松' };
    if (d === 'hard') return { mul: 1.4, restAdd: -2, kcal: 1.25, label: '挑战' };
    return { mul: 1, restAdd: 0, kcal: 1, label: '标准' };
  }
  function scaleAction(a, cfg) {
    var b = {}; for (var k in a) b[k] = a[k];
    var v = a.value;
    b.value = a.type === 'reps' ? Math.max(5, Math.round(v * cfg.mul)) : Math.max(10, Math.round(v * cfg.mul));
    return b;
  }
  function diffSeg() {
    var on = function (k) { return S.diff === k ? ' on' : ''; };
    return '<div class="diff-seg"><span class="dl">训练难度</span>' +
      '<div class="o' + on('easy') + '" data-a="setDiff" data-v="easy">轻松</div>' +

  /* ============ 热身序列（开练前的独立引导屏，按训练类型自适应） ============ */
  // 取动作库里带真人 GIF 的动感/激活类动作，保证一致观感
  // kind: cardio(燃脂) | strength(力量) | core(核心) | stretch(拉伸)
  var WARM_SETS = {
    cardio: [['开合跳', 30], ['高抬腿', 30], ['深蹲跳', 15], ['登山者', 30], ['弓步跳', 16], ['肩胸拉伸', 25]],
    strength: [['肩胸拉伸', 30], ['深蹲', 15], ['弓步蹲', 16], ['站姿提踵', 20], ['标准俯卧撑', 12], ['开合跳', 20]],
    core: [['肩胸拉伸', 30], ['臀桥', 15], ['登山者', 30], ['站姿提踵', 20], ['卷腹', 15]],
    stretch: [['肩胸拉伸', 35], ['臀桥', 15], ['站姿提踵', 20], ['深蹲', 12], ['开合跳', 20]]

  function buildWarmSeq(kind) {

    }).filter(Boolean);
  }
  function warmKindFromCourse(cat) {

  }

  }
  function warmKindFromBuilder(sel) {

  /* ============ 跟练引擎 ============ */
  var W = null, WT = null;
  function startW(seq, title, icon, kcal, bg, tag, restSec, warmSeq) {
    var warm = (warmSeq && warmSeq.length) ? warmSeq : [];
    var full = warm.concat(seq);
    W = { seq: full, firstMain: warm.length, warmAck: warm.length === 0, title: title, icon: icon, kcal: kcal || 0, bg: bg || '#1FD6A8', i: 0, phase: 'ready', rem: 3,
      actual: 0, detail: [], t0: Date.now(), rest: (restSec != null ? restSec : S.restSec), paused: false, prs: 0, tag: tag };
    $('#wko').classList.remove('hide');
    keepAwake(true); // 跟练期间屏幕常亮
    ensureAudio();   // 组间节拍器：在用户点击的 gesture 链内初始化音频
    renderW();
    updateHUD();
    speak(warm.length ? ('先做热身运动，共 ' + warm.length + ' 个热身动作') : ('准备开始，共 ' + seq.length + ' 个动作'));
    speak(String(W.rem)); // 3-2-1 起始数字
    WT = setInterval(onTick, 1000);
  }
  function curA() { return W.seq[W.i]; }
  function onTick() {
    if (!W || W.paused) return;
    if (W.phase === 'ready') {
      W.rem--;
      if (W.rem <= 0) { speak('开始'); enterAct(); } else { speak(String(W.rem)); refreshN(); }
    } else if (W.phase === 'act') {
      if (curA().type === 'time' || curA().type === 'reps') { W.rem--; if (W.rem <= 0) { W.actual = curA().value; leaveAct(); } else refreshN(); }
    } else if (W.phase === 'rest') {
      W.rem--;
      if (W.rem <= 0) { restEnd(); goNext(); }   // 休息结束：强 beep + 震动，进下一动作
      else { tick(); refreshN(); }                // 倒计时每秒轻 tick
    }
    updateHUD();
  }
  function enterAct() {
    W.phase = 'act'; W.actual = 0;
    var a = curA();
    // 计时类按秒倒数；计数类按"每 reps 约 3 秒"估算时长自动跟练，免来回点屏幕
    W.rem = a.type === 'time' ? a.value : Math.max(8, Math.round(a.value * 3));
    var lead = a.phase === 'fin' ? '收尾' : a.phase === 'cool' ? '冷身' : '第 ' + (W.i + 1) + ' 个';
    speak(lead + '，' + a.name + '，' + (a.type === 'reps' ? a.value + ' 次' : '保持 ' + a.value + ' 秒'));
    if (a.cue) setTimeout(function () { if (W && W.phase === 'act') speak(a.cue); }, 1500);
    renderW();

  function leaveAct() {   // 结束当前动作 → 休息（W.i 停在刚完成的动作上，不前进）
    var a = curA();

    if (a === 'replan') { S.plan = null; saveK(KP, null); renderView(); return; }
    if (a === 'week') { S.weekIdx = Number(el.dataset.i); renderView(); return; }
    if (a === 'openCourse') { var c = courses.filter(function (x) { return x.id === el.dataset.id; })[0]; if (c) sheetCourse(c); return; }
    if (a === 'runCourse') { closeSheet(); runCourse(el.dataset.id); return; }
    if (a === 'actInfo') { sheetAct(el.dataset.name); return; }
    if (a === 'actVariant') { sheetAct(el.dataset.name); return; }
    /* 自定义训练 builder */
    if (a === 'bldToggle') {
      var nm = el.dataset.name;
      if (S.builder.sel[nm]) delete S.builder.sel[nm]; else S.builder.sel[nm] = 1;
      renderView(); return;
    }
    if (a === 'bldRound') {
      S.builder.rounds = Math.max(1, Math.min(5, S.builder.rounds + (v === '1' ? 1 : -1)));
      renderView(); return;
    }
    if (a === 'bldStart') { closeSheet(); bldStart(); return; }
    if (a === 'openDay') { sheetDay(Number(el.dataset.w), Number(el.dataset.i)); return; }
    if (a === 'runDay') { closeSheet(); runPlanDay(Number(el.dataset.w), Number(el.dataset.i)); return; }
    if (a === 'editDay') { sheetEditDay(Number(el.dataset.w), Number(el.dataset.i)); return; }
    if (a === 'swapAct') { sheetSwap(Number(el.dataset.w), Number(el.dataset.i), el.dataset.name); return; }
    if (a === 'doSwap') {
      var dw = Number(el.dataset.w), di = Number(el.dataset.i), from = el.dataset.from, to = el.dataset.to;
      var dd = S.plan.weeks[dw] && S.plan.weeks[dw].week[di]; if (!dd) return;
      var t = NS.actionByName[to]; if (!t) return;
      dd.acts.forEach(function (act) { if (act.name === from && !act.fin && !act.cool) { act.name = to; act.icon = t.icon || '🏋️'; act.type = t.type; act.cue = t.cue || ''; act.fromHist = false; } });
      dd.seq.forEach(function (s) { if (s.name === from && s.phase === 'main') { s.name = to; s.icon = t.icon || '🏋️'; s.type = t.type; s.cue = t.cue || ''; } });
      S.plan.edited = true; saveK(KP, S.plan);
      sheetEditDay(dw, di); return;
    }
    if (a === 'daySets') {
      var dws = Number(el.dataset.w), dis = Number(el.dataset.i), dv = el.dataset.v === '1' ? 1 : -1;
      var dds = S.plan.weeks[dws] && S.plan.weeks[dws].week[dis]; if (!dds) return;
      var ms = dds.acts.filter(function (x) { return !x.fin && !x.cool; });
      if (!ms.length) return;
      var nr = Math.max(1, Math.min(6, ms[0].round + dv));
      ms.forEach(function (x) { x.round = nr; });
      rebuildSeq(dds);
      S.plan.edited = true; saveK(KP, S.plan);
      sheetEditDay(dws, dis); return;
    }
    if (a === 'replay') {
      var r = S.records[0]; if (!r) return;
      if (r.tag && r.tag.indexOf('fit_course_') === 0) { runCourse(r.tag.slice(10)); return; }
      if (r.tag && r.tag.indexOf('fit_plan_') === 0) {
        var ps = r.tag.slice(9).split('_');
        if (S.plan && S.plan.weeks[Number(ps[0])]) runPlanDay(Number(ps[0]), Number(ps[1]));
        return;
      }
      return;
    }
    if (a === 'recDetail') { sheetRec(Number(el.dataset.i)); return; }
    /* 饮食规划 */
    if (a === 'dform') { S.dietDraft[k] = v; renderView(); return; }
    if (a === 'saveDiet') { S.diet = Object.assign({}, S.dietDraft, { training: false }); saveK('fit_diet', S.diet); renderView(); return; }
    if (a === 'dietEdit') { S.dietDraft = Object.assign({}, S.diet); S.diet = null; saveK('fit_diet', null); renderView(); return; }
    if (a === 'dietTrain') { if (S.diet) { S.diet.training = (v === '1'); saveK('fit_diet', S.diet); renderView(); } return; }
    if (a === 'dietRegen') { renderView(); return; }
    /* 饮食搭配自检 */
    if (a === 'pairPick') { S.dietPair[k] = (S.dietPair[k] === v ? '' : v); S.dietPairRes = null; renderView(); return; }
    if (a === 'pairCheck') {
      var sel = S.dietPair; var foods = [sel.staple, sel.protein, sel.veg, sel.other].filter(function (x) { return x; });
      var pItems = [], pWarn = false;
      for (var pi = 0; pi < foods.length; pi++) for (var pj = pi + 1; pj < foods.length; pj++) {
        var pr = pairLookup(foods[pi], foods[pj]);
        if (pr) { pItems.push(pr); if (pr.t === 'warn') pWarn = true; }
      }
      S.dietPairRes = { warn: pWarn, items: pItems };
      renderView(); return;
    }
    /* 跟练 */
    if (a === 'skipReady') { enterAct(); return; }
    if (a === 'beginMain') { if (W && W.phase === 'warmDone') { W.warmAck = true; W.i = W.firstMain; enterAct(); } return; }
    if (a === 'addRep') {
      if (W.actual < curA().value) { W.actual++; refreshN(); }
      else leaveAct();
      return;
    }
    if (a === 'repDec') { if (W.actual > 0) { W.actual--; refreshN(); } return; }
    if (a === 'skipRest') {
      if (W.phase === 'rest') goNext(); else if (W.phase === 'act') leaveAct();
      return;
    }
    if (a === 'finishAct') { if (W && W.phase === 'act') { W.actual = curA().value; leaveAct(); } return; }
    if (a === 'pauseW') { if (W) { W.paused = !W.paused; } return; }
    if (a === 'closeW') { closeW(); return; }
    if (a === 'toggleVoice') { VOICE_ON = !VOICE_ON; saveK('fit_voice', VOICE_ON); if (!VOICE_ON) spStop(); renderW(); return; }
    if (a === 'setDiff') { S.diff = v; saveK('fit_diff', S.diff); if (S._course) sheetCourse(S._course); else if (S._day) sheetDay(S._day.w, S._day.i); return; }
    if (a === 'restMore') { if (W && W.phase === 'rest') { W.rem += 10; refreshN(); speak('休息 ' + W.rem + ' 秒'); } return; }
    if (a === 'restLess') { if (W && W.phase === 'rest') { W.rem = Math.max(2, W.rem - 5); refreshN(); } return; }
  });
  /* 点遮罩关 sheet */
  app.addEventListener('click', function (e) { if (e.target && e.target.id === 'sheetMask') closeSheet(); });
  /* 饮食表单：数字输入实时写草稿（不重渲染，避免丢失焦点） */
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('fld')) {
      var k = t.dataset.k;
      S.dietDraft[k] = (k === 'age' || k === 'height' || k === 'weight') ? (Number(t.value) || 0) : t.value;
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'impFile') { importData(t.files && t.files[0]); t.value = ''; }
  });

  renderShell();
})();

</script>
